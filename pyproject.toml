[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-dot"
version = "0.1.0"
description = "Independent offline voice assistant for Windows and Linux"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials==6.12.0", "vosk==0.3.45", "sounddevice==0.5.6", "pyttsx3==2.99", "numpy==2.5.4"]

[project.scripts]
jarvis-dot = "jarvis.main:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
